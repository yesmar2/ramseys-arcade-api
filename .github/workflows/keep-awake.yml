name: Keep the API awake

# Render's free plan puts the API to sleep after 15 quiet minutes, and asleep it
# can't send a match alert, end an event or roll a week over on time. A ping
# every 10 minutes keeps it up; the API's own sweep does the rest (src/sweep.ts).
# GitHub may run a scheduled job a few minutes late, which a 3-hour match
# warning can live with.

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping /health
        # A cold start can take the best part of a minute, so it gets time and a retry.
        run: >-
          curl --fail --silent --show-error --max-time 120
          --retry 3 --retry-delay 15 --retry-all-errors
          https://ramseys-arcade-api.onrender.com/health
